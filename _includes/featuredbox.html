<!-- begin featured post -->
<div class="col-6 col-md-4 col-lg-2 mb-4">
    <a href="{{ site.baseurl }}{{ post.url }}" class="featured-card {% unless post.isAvailable %}featured-card--sold{% endunless %}">

        <div class="featured-card__image-wrap">
            {% if post.image %}
            <img src="{% if post.image contains '://' %}{{ post.image }}{% else %}{{ site.baseurl }}/{{ post.image }}{% endif %}"
                 alt="{{ post.title }}" class="featured-card__image">
            {% endif %}

            {% unless post.isAvailable %}
            <div class="featured-card__sold-overlay">
                <span class="featured-card__sold-stamp">Sudah Terjual</span>
            </div>
            {% endunless %}
        </div>

        <div class="featured-card__label">
            {% if post.breed %}<p class="featured-card__title">{{ post.breed }}</p>{% endif %}
            {% if post.colour %}<p class="featured-card__subtitle">{{ post.colour }}</p>{% endif %}
        </div>

    </a>
</div>
<!-- end featured post -->
