<!-- begin static feature -->
<div class="col-md-6 mb-4">
    <div class="list-featured-tag h-100">
        <div class="row h-100">
            <div class="col-12 col-md-12 col-lg-5 pr-lg-0">
                <div class="h-100">
                    <div class="wrap-thumbnail">
                        <a href="{{ site.baseurl }}{{ include.url }}">
                            {% if site.lazyimages == "enabled" %}
                            <img class="featured-box-img-cover lazy-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAMAAAACCAQAAAA3fa6RAAAADklEQVR42mNkAANGCAUAACMAA2w/AMgAAAAASUVORK5CYII=" data-src="{% if include.image contains "://" %}{{ include.image }}{% else %}{{ site.baseurl }}/{{ include.image }}{% endif %}">
                            {% else %}
                            <img class="featured-box-img-cover" src="{% if include.image contains "://" %}{{ include.image }}{% else %}{{ site.baseurl }}/{{ include.image }}{% endif %}">
                            {% endif %}
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-12 col-lg-7">
                <div class="h-100 card-group">
                    <div class="card">
                        <div class="card-body">
                            <h2 class="card-title">
                                <a class="text-dark" href="{{ site.baseurl }}{{ include.url }}">{{ include.title }}</a>
                            </h2>

                            <h4 class="card-text">{{ include.excerpt }}</h4>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- end static feature -->
