<script>
    (function(){
        var shareUrl = "{{ page.url | absolute_url }}";
        var shareTitle = "{{ page.title | escape }}";

        function nativeShare(){
            if(navigator.share){
                navigator.share({title: shareTitle, text: shareTitle, url: shareUrl}).catch(function(){});
                return true;
            }
            return false;
        }

        window.shareToInstagram = function(){
            if(nativeShare()) return;
            // try app scheme, fallback to Instagram homepage
            window.location = 'instagram://app';
            setTimeout(function(){ window.open('https://www.instagram.com', '_blank'); }, 700);
        };

        window.shareToTikTok = function(){
            if(nativeShare()) return;
            // try TikTok app scheme, fallback to tiktok.com
            window.location = 'snssdk1128://';
            setTimeout(function(){ window.open('https://www.tiktok.com', '_blank'); }, 700);
        };

        window.copyLink = function(el){
            if(navigator.clipboard && navigator.clipboard.writeText){
                navigator.clipboard.writeText(shareUrl).then(function(){ showCopied(el); }).catch(function(){ fallbackCopy(el); });
                return;
            }
            fallbackCopy(el);
        };

        function fallbackCopy(el){
            var ta = document.createElement('textarea'); ta.value = shareUrl; document.body.appendChild(ta); ta.select();
            try{ document.execCommand('copy'); showCopied(el); }catch(e){}
            ta.remove();
        }

        function showCopied(el){
            var orig = el.innerHTML;
            el.innerHTML = 'Copied';
            setTimeout(function(){ el.innerHTML = orig; }, 2000);
        }
    })();
</script>
